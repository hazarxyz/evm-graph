  "lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/:forge-std/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/lib/forge-std/src/",
  "lib/v4-periphery/lib/v4-core/lib/solmate/:ds-test/=lib/v4-periphery/lib/v4-core/lib/solmate/lib/ds-test/src/",
