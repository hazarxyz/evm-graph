[profile.default]
src = "src/test123"
out = "out"
test = "test/test123"
script = "script/test123"
libs = ["lib"]
solc_version = "0.8.26"
evm_version = "cancun"
extra_output = ["storageLayout"]
build_info = true
fs_permissions = [{ access = "read-write", path = "./evidence/test123" }]
optimizer = true
optimizer_runs = 200
auto_detect_remappings = false
remappings = [
  "@openzeppelin/contracts-upgradeable/=lib/openzeppelin-contracts-upgradeable/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  "@uniswap/v4-core/=lib/v4-periphery/lib/v4-core/",
  "@uniswap/v4-periphery/=lib/v4-periphery/",
  "permit2/=lib/v4-periphery/lib/permit2/",
  "solmate/=lib/v4-periphery/lib/v4-core/lib/solmate/src/",
  "lib/v4-periphery/lib/permit2/lib/forge-gas-snapshot/lib/forge-std/:ds-test/=lib/v4-periphery/lib/permit2/lib/forge-gas-snapshot/lib/forge-std/lib/ds-test/src/",
  "lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/lib/forge-std/:ds-test/=lib/v4-periphery/lib/v4-core/lib/openzeppelin-contracts/lib/forge-std/lib/ds-test/src/",
  "lib/v4-periphery/lib/permit2/lib/forge-gas-snapshot/:forge-std/=lib/v4-periphery/lib/permit2/lib/forge-gas-snapshot/lib/forge-std/src/",
